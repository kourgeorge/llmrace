<svg width="920" height="428" viewBox="0 0 920 428" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="llmrace terminal demo: running one model five times and reporting median, min, and max speed">
  <style>
    text { white-space: pre; }
    .base { fill:#c9d1d9; font-size:13.5px; }
    .dim  { fill:#6e7681; font-size:13.5px; }
    .bold { font-weight:700; }
  </style>

  <!-- window -->
  <rect x="0" y="0" width="920" height="428" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="919" height="427" rx="9.5" fill="none" stroke="#30363d"/>

  <!-- title bar -->
  <path d="M0.5 10 A9.5 9.5 0 0 1 10 0.5 H910 A9.5 9.5 0 0 1 919.5 10 V38 H0.5 Z" fill="#161b22"/>
  <line x1="0.5" y1="38" x2="919.5" y2="38" stroke="#30363d"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="19" r="6" fill="#27c93f"/>
  <text x="460" y="23" text-anchor="middle" class="dim">zsh — llmrace</text>

  <!-- command -->
  <text x="24" y="66" class="base"><tspan fill="#58a6ff">❯ </tspan><tspan fill="#e6edf3">npx llmrace --provider groq --model openai/gpt-oss-120b --runs 5</tspan></text>

  <!-- single-model result block -->
  <text x="24" y="102" class="base bold" fill="#e6edf3">🏁 groq/openai/gpt-oss-120b  <tspan fill="#8b949e" font-weight="400">(5 runs)</tspan></text>

  <text x="24" y="132" class="base"><tspan fill="#8b949e">  TTFT          </tspan><tspan fill="#e6edf3">median 118 ms</tspan><tspan fill="#6e7681">  (98-142 ms)</tspan></text>
  <text x="24" y="160" class="base"><tspan fill="#8b949e">  stream tok/s  </tspan><tspan fill="#fbbf24">median 512.3</tspan><tspan fill="#e6edf3">  🏎️ Kachow!</tspan><tspan fill="#6e7681">  (480.1-540.7)</tspan></text>
  <text x="24" y="188" class="base"><tspan fill="#8b949e">  eff tok/s     </tspan><tspan fill="#e6edf3">median 402.8</tspan><tspan fill="#6e7681">  (tokens ÷ total time — reliable either way)</tspan></text>
  <text x="24" y="216" class="base"><tspan fill="#8b949e">  total         </tspan><tspan fill="#e6edf3">median 612 ms</tspan><tspan fill="#6e7681">  (560-680 ms)</tspan></text>
  <text x="24" y="244" class="base"><tspan fill="#8b949e">  success       </tspan><tspan fill="#3fb950">5/5 runs</tspan></text>

  <!-- speed grade legend -->
  <line x1="24" y1="270" x2="896" y2="270" stroke="#21262d"/>
  <text x="24" y="292" class="dim">Speed grades</text>
  <text x="24"  y="318" class="base" fill="#fbbf24">🏎️ Kachow!</text>
  <text x="150" y="318" class="dim">≥500 tok/s</text>
  <text x="270" y="318" class="base" fill="#a78bfa">⚡ Ludicrous Speed</text>
  <text x="460" y="318" class="dim">200–499</text>
  <text x="560" y="318" class="base" fill="#34d399">🚀 Warp Drive</text>
  <text x="700" y="318" class="dim">100–199</text>
  <text x="24"  y="346" class="base" fill="#60a5fa">🏃 Cruising</text>
  <text x="150" y="346" class="dim">50–99</text>
  <text x="270" y="346" class="base" fill="#94a3b8">🐌 Rush Hour</text>
  <text x="460" y="346" class="dim">&lt;50 tok/s</text>

  <text x="24" y="392" class="dim" font-style="italic">Illustrative numbers — your model, your network, your speed. Drop --runs 5 for a single quick test.</text>
</svg>
