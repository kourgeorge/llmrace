<svg width="920" height="454" viewBox="0 0 920 454" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="llmrace terminal demo: racing three providers and ranking them by speed">
  <style>
    text { white-space: pre; }
    .base { fill:#c9d1d9; font-size:13.5px; }
    .dim  { fill:#6e7681; font-size:13.5px; }
    .bold { font-weight:700; }
  </style>

  <!-- window -->
  <rect x="0" y="0" width="920" height="454" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="919" height="453" rx="9.5" fill="none" stroke="#30363d"/>

  <!-- title bar -->
  <path d="M0.5 10 A9.5 9.5 0 0 1 10 0.5 H910 A9.5 9.5 0 0 1 919.5 10 V38 H0.5 Z" fill="#161b22"/>
  <line x1="0.5" y1="38" x2="919.5" y2="38" stroke="#30363d"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="19" r="6" fill="#27c93f"/>
  <text x="460" y="23" text-anchor="middle" class="dim">zsh — llmrace --race</text>

  <!-- command -->
  <text x="24" y="66" class="base"><tspan fill="#58a6ff">❯ </tspan><tspan fill="#e6edf3">npx llmrace --race groq:llama-3.3-70b-versatile,cerebras:llama-3.3-70b,openai:gpt-4o-mini</tspan></text>

  <!-- finish lines -->
  <text x="24" y="96" class="base"><tspan fill="#3fb950">[1]</tspan><tspan class="bold" fill="#e6edf3"> groq/llama-3.3-70b-versatile</tspan><tspan fill="#8b949e"> — done (</tspan><tspan fill="#fbbf24">912.4 stream tok/s</tspan><tspan fill="#8b949e">, 578.9 eff tok/s, TTFT 118 ms) 🏎️</tspan></text>
  <text x="24" y="118" class="base"><tspan fill="#3fb950">[2]</tspan><tspan class="bold" fill="#e6edf3"> cerebras/llama-3.3-70b</tspan><tspan fill="#8b949e"> — done (</tspan><tspan fill="#a78bfa">344.8 stream tok/s</tspan><tspan fill="#8b949e">, 277.4 eff tok/s, TTFT 132 ms) ⚡</tspan></text>
  <text x="24" y="140" class="base"><tspan fill="#3fb950">[3]</tspan><tspan class="bold" fill="#e6edf3"> openai/gpt-4o-mini</tspan><tspan fill="#8b949e"> — done (</tspan><tspan fill="#60a5fa">96.7 stream tok/s</tspan><tspan fill="#8b949e">, 84.3 eff tok/s, TTFT 284 ms) 🏃</tspan></text>

  <!-- table -->
  <text x="24"  y="176" class="dim">#</text>
  <text x="64"  y="176" class="dim">PROVIDER/MODEL</text>
  <text x="432" y="176" class="dim">stream tok/s</text>
  <text x="546" y="176" class="dim">eff tok/s</text>
  <text x="642" y="176" class="dim">TTFT</text>
  <text x="722" y="176" class="dim">total</text>
  <text x="812" y="176" class="dim">tokens</text>
  <line x1="24" y1="184" x2="896" y2="184" stroke="#21262d"/>

  <text x="24"  y="206" class="base bold" fill="#fbbf24">🥇</text>
  <text x="64"  y="206" class="base bold" fill="#e6edf3">groq/llama-3.3-70b-versatile 🏎️</text>
  <text x="432" y="206" class="base bold" fill="#fbbf24">912.4</text>
  <text x="546" y="206" class="base bold" fill="#e6edf3">578.9</text>
  <text x="642" y="206" class="base bold" fill="#e6edf3">118 ms</text>
  <text x="722" y="206" class="base bold" fill="#e6edf3">323 ms</text>
  <text x="812" y="206" class="base bold" fill="#e6edf3">187</text>

  <text x="24"  y="230" class="base">🥈</text>
  <text x="64"  y="230" class="base" fill="#c9d1d9">cerebras/llama-3.3-70b ⚡</text>
  <text x="432" y="230" class="base" fill="#a78bfa">344.8</text>
  <text x="546" y="230" class="base">277.4</text>
  <text x="642" y="230" class="base">132 ms</text>
  <text x="722" y="230" class="base">674 ms</text>
  <text x="812" y="230" class="base">187</text>

  <text x="24"  y="254" class="base">🥉</text>
  <text x="64"  y="254" class="base" fill="#c9d1d9">openai/gpt-4o-mini 🏃</text>
  <text x="432" y="254" class="base" fill="#60a5fa">96.7</text>
  <text x="546" y="254" class="base">84.3</text>
  <text x="642" y="254" class="base">284 ms</text>
  <text x="722" y="254" class="base">2218 ms</text>
  <text x="812" y="254" class="base">187</text>

  <text x="24" y="284" class="dim">Ranked by eff tok/s (tokens ÷ total time) — reliable across buffered and streamed lanes.</text>

  <!-- speed grade legend -->
  <line x1="24" y1="304" x2="896" y2="304" stroke="#21262d"/>
  <text x="24" y="326" class="dim">Speed grades</text>
  <text x="24"  y="352" class="base" fill="#fbbf24">🏎️ Kachow!</text>
  <text x="150" y="352" class="dim">≥500 tok/s</text>
  <text x="270" y="352" class="base" fill="#a78bfa">⚡ Ludicrous Speed</text>
  <text x="460" y="352" class="dim">200–499</text>
  <text x="560" y="352" class="base" fill="#34d399">🚀 Warp Drive</text>
  <text x="700" y="352" class="dim">100–199</text>
  <text x="24"  y="380" class="base" fill="#60a5fa">🏃 Cruising</text>
  <text x="150" y="380" class="dim">50–99</text>
  <text x="270" y="380" class="base" fill="#94a3b8">🐌 Rush Hour</text>
  <text x="460" y="380" class="dim">&lt;50 tok/s</text>

  <text x="24" y="422" class="dim" font-style="italic">Illustrative numbers — your race, your providers, your speeds.</text>
</svg>
